<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Power BI TV Rotator - Otimizado</title>
  <style>
    :root {
      --bg: #000;
      --fg: #fff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    /*
      IMPORTANTE:
      Não usamos display:none nos iframes.
      O Power BI pode calcular o tamanho errado quando carrega escondido com display:none.
      Por isso os frames ficam sempre com tamanho real, apenas invisíveis.
    */
    .frame {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      background: #000;
      opacity: 0;
      visibility: hidden;
      z-index: 1;
      pointer-events: none;
    }

    .frame.active {
      opacity: 1;
      visibility: visible;
      z-index: 2;
      pointer-events: auto;
    }

    #overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #overlay.hidden { display: none; }

    .panel {
      width: min(92vw, 520px);
      background: rgba(20, 20, 20, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 22px;
      text-align: center;
    }

    .panel h1 {
      margin: 0 0 10px;
      font-size: 26px;
    }

    .panel p {
      margin: 0 0 18px;
      color: rgba(255, 255, 255, 0.78);
      line-height: 1.45;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
      background: #2a2a2a;
      color: #fff;
    }

    button.primary { background: #2d7ff9; }

    #hud {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 9;
      display: none;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }

    .chip {
      background: rgba(0, 0, 0, 0.55);
      color: rgba(255, 255, 255, 0.92);
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }

    #status {
      max-width: 60vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    body.show-hud #hud { display: flex; }
  </style>
</head>
<body>
  <div id="app">
<iframe id="frame0" class="frame active" title="Power BI 1"></iframe>
<iframe id="frame1" class="frame" title="Power BI 2"></iframe>
<iframe id="frame2" class="frame" title="Power BI 3"></iframe>
<iframe id="frame3" class="frame" title="Power BI 4"></iframe>

    <div id="overlay">
      <div class="panel">
        <h1>Painel da TV</h1>
        <p>Clique em <strong>Iniciar</strong> para abrir em tela cheia e começar a rotação.</p>
        <div class="actions">
          <button id="startBtn" class="primary">Iniciar</button>
          <button id="fullscreenBtn">Tela cheia</button>
        </div>
      </div>
    </div>

    <div id="hud">
      <div id="status" class="chip">Aguardando início…</div>
      <div id="countdown" class="chip">--</div>
    </div>
  </div>

  <script>
    const config = {
      fullscreen: true,
      autoStart: true,
      showHud: false,

      // Tempo para trocar de relatório.
      durationSeconds: 35,

      // Reload invisível dos relatórios escondidos: 30 minutos.
      // O relatório que estiver aparecendo não é recarregado naquele momento.
      tabReloadIntervalSeconds: 1800,

      // Reload da página HTML inteira: 12 horas.
      appReloadIntervalMinutes: 720,

      websites: [
        "https://app.powerbi.com/view?r=eyJrIjoiMDQ0Y2VhNDMtYmVjMC00MzE4LTg2NjUtM2JjMGM1ZjdiYWMzIiwidCI6ImQxODgzN2QxLWM5ZWQtNGVmOS04NWUwLTc5ZDkyMzc0ZTgxMyJ9&pageName=8c65a5bd9dc5ea7ecb42",
        "https://app.powerbi.com/view?r=eyJrIjoiMDQ0Y2VhNDMtYmVjMC00MzE4LTg2NjUtM2JjMGM1ZjdiYWMzIiwidCI6ImQxODgzN2QxLWM5ZWQtNGVmOS04NWUwLTc5ZDkyMzc0ZTgxMyJ9&pageName=cc948bfb5e8b00603019",
        "https://app.powerbi.com/view?r=eyJrIjoiMDQ0Y2VhNDMtYmVjMC00MzE4LTg2NjUtM2JjMGM1ZjdiYWMzIiwidCI6ImQxODgzN2QxLWM5ZWQtNGVmOS04NWUwLTc5ZDkyMzc0ZTgxMyJ9&pageName=02c8892ba1b199e841cd",
        "https://app.powerbi.com/view?r=eyJrIjoiMDJjZDJjNGEtY2I3My00NTRkLWEzNDAtN2Q3N2QzZjljZjYxIiwidCI6ImQxODgzN2QxLWM5ZWQtNGVmOS04NWUwLTc5ZDkyMzc0ZTgxMyJ9&pageName=bf8f54d3a940e032bfda"
      ]
    };

const frames = [
  document.getElementById("frame0"),
  document.getElementById("frame1"),
  document.getElementById("frame2"),
  document.getElementById("frame3")
];
    

    const overlay = document.getElementById("overlay");
    const startBtn = document.getElementById("startBtn");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const statusEl = document.getElementById("status");
    const countdownEl = document.getElementById("countdown");

    if (config.showHud) document.body.classList.add("show-hud");

    let started = false;
    let currentIndex = 0;
    let switchTimer = null;
    let countdownTimer = null;
    let appReloadTimer = null;
    let reloadTimer = null;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function enterFullscreen() {
      if (!config.fullscreen) return;
      const el = document.documentElement;
      if (!document.fullscreenElement && el.requestFullscreen) {
        el.requestFullscreen().catch(() => {});
      }
    }

    function preloadAllFrames() {
      frames.forEach((frame, index) => {
        if (!frame.src) {
          frame.src = config.websites[index];
        }
      });
    }

    function showFrame(index) {
      frames.forEach((frame, i) => {
        frame.classList.toggle("active", i === index);
      });

      currentIndex = index;
      setStatus(`Exibindo página ${index + 1} de ${frames.length}`);
      startCountdown(config.durationSeconds);
    }

    function nextFrame() {
      const nextIndex = (currentIndex + 1) % frames.length;
      showFrame(nextIndex);

      clearTimeout(switchTimer);
      switchTimer = setTimeout(nextFrame, config.durationSeconds * 1000);
    }

    function startCountdown(seconds) {
      let remaining = seconds;
      countdownEl.textContent = `${remaining}s`;

      clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        remaining -= 1;
        countdownEl.textContent = `${Math.max(remaining, 0)}s`;
        if (remaining <= 0) clearInterval(countdownTimer);
      }, 1000);
    }

    function reloadHiddenFrames() {
      frames.forEach((frame, index) => {
        if (index === currentIndex) return;

        const url = config.websites[index];

        // Reload só dos relatórios escondidos para não aparecer loading na tela.
        frame.src = "about:blank";

        setTimeout(() => {
          frame.src = url;
        }, 300);
      });
    }

    function setupTimers() {
      clearTimeout(switchTimer);
      clearInterval(reloadTimer);
      clearInterval(appReloadTimer);

      switchTimer = setTimeout(nextFrame, config.durationSeconds * 1000);

      reloadTimer = setInterval(
        reloadHiddenFrames,
        config.tabReloadIntervalSeconds * 1000
      );

      appReloadTimer = setInterval(() => {
        window.location.reload();
      }, config.appReloadIntervalMinutes * 60 * 1000);
    }

    function startRotation() {
      if (started) return;
      started = true;

      overlay.classList.add("hidden");
      enterFullscreen();

      preloadAllFrames();

      // Pequeno atraso para o navegador calcular o tamanho real dos iframes.
      setTimeout(() => {
        showFrame(0);
        setupTimers();
      }, 500);
    }

    startBtn.addEventListener("click", startRotation);
    fullscreenBtn.addEventListener("click", enterFullscreen);

    window.addEventListener("resize", () => {
      // Força o Power BI a recalcular layout quando muda tela/tamanho.
      frames.forEach((frame) => {
        frame.style.width = "100vw";
        frame.style.height = "100vh";
      });
    });

    window.addEventListener("beforeunload", () => {
      clearTimeout(switchTimer);
      clearInterval(countdownTimer);
      clearInterval(appReloadTimer);
      clearInterval(reloadTimer);
    });

    if (config.autoStart) {
      startRotation();
    }
  </script>
</body>
</html>
